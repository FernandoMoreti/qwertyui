name: Gerar APK do Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ─── ADICIONE ESTA SEÇÃO AQUI EMBAIXO ─────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar config.json falso para a build passar
        run: |
          echo '{"GOOGLE_PLACES_KEY": "AIzaSyDWs2Uvi2MSBfCBA_uVJqYWJAjyqWtgDyk", "GEMINI_API_KEY": "AQ.Ab8RN6L6q2QdDHsRrUhO-W5sOywhbuFOf_SDRtte6T8UM2KKPA"}' > config.json

      - name: Instalar dependências do projeto
        run: flutter pub get

      - name: Compilar APK (Debug)
        run: flutter build apk --debug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
