name: Gerar APK do Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ─── ADICIONE ESTA SEÇÃO AQUI EMBAIXO ─────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependências do projeto
        run: flutter pub get

      - name: Compilar APK (Release com as Chaves)
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_PLACES_KEY="${{ secrets.GOOGLE_PLACES_KEY }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
